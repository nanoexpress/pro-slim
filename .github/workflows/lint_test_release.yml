# This workflow will do a clean install of dependencies, build the source code and run tests
# For more information see: https://help.github.actions/language-and-framework-guides

name: Linting, Testing and Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Bun.sh
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache
        uses: actions/cache@v6
        with:
          path: '~/.bun/install/cache'
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint code
        run: bun run lint
  test:
    needs: lint
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Use Bun.sh
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Use Node.js 26 (node:test runtime + uWS binaries)
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Cache
        uses: actions/cache@v6
        with:
          path: '~/.bun/install/cache'
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test code
        run: bun run test
  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Bun.sh
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache
        uses: actions/cache@v6
        with:
          path: '~/.bun/install/cache'
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
